<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{og}}
<meta name="theme-color" content="#151A7A">
<link rel="icon" href="{{pfad}}assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{pfad}}assets/logo/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{pfad}}assets/logo/apple-touch-icon.png">
<!-- App-Modus (P9, Plan-Abschnitt B1): Klasse so früh wie möglich setzen,
     vor den Stylesheets, damit die App-Kopfzeile/Tab-Leiste beim Laden nicht
     erst sichtbar umspringt (assets/js/nav.js setzt dieselbe Klasse
     zusätzlich, siehe dort). -->
<script>
if (/(?:^|[?&])ansicht=app(?:&|$)/.test(location.search)) document.documentElement.classList.add("ansicht-app");
</script>
<link rel="preload" href="{{pfad}}assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{pfad}}assets/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{pfad}}assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<!-- P11, Plan-Abschnitt B2: ein gebündeltes, minifiziertes Stylesheet statt
     fünf einzelner Requests (weniger render-blockierende Anfragen). Die
     Einzeldateien liegen weiterhin unter assets/css/ (siehe tools/build.mjs,
     baueCssBuendel()) – der Styleguide verweist auf sie als Quelltext. -->
<link rel="stylesheet" href="{{pfad}}assets/css/site.css">
<script src="{{pfad}}assets/js/nav.js" defer></script>
</head>
<body class="{{bodyclass}}">
<a class="sprungmarke" href="#inhalt">Zum Inhalt</a>
{{header}}
<main id="inhalt">
{{inhalt}}
</main>
{{footer}}
</body>
</html>
