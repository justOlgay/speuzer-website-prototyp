<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="format-detection" content="telephone=no">
<meta name="format-detection" content="address=no">
<meta name="format-detection" content="email=no">
<meta name="format-detection" content="date=no">
<title>Spielplan &amp; Tabellen</title>
<style>

<!-- Speuzer Blau-Weiß – Spielplan-App.html (C2)
     Statische Workspace-Seite (kein appack-Modul, kein FreeMarker-Titelausdruck): FUSSBALL.DE-
     Widgets sind nur für die Domain cdn.appack.de freigegeben, eine dynamische
     .tpl-Seite (appack.de/rest-api/drender/...) könnte sie nicht zeigen. Wird 1:1 in
     den appack-Workspace hochgeladen und unter
     https://cdn.appack.de/sportfreunde04/workspace/Spielplan-App.html ausgeliefert.
     Erzeugt aus src/app/Spielplan-App.html durch tools/app-optik/tpl-bauen.mjs
     (npm run tpl-bauen) – NICHT von Hand bearbeiten. Details: assets/app/LIESMICH.md,
     Abschnitt "Stufe C2". -->

/* Speuzer Blau-Weiß – v3-basis.css (C1)
   Gemeinsame Grundlage der appack-Vorlagen-Familie "_v3" (Startseite_v3.tpl
   [B1] und die fünf Vereinsseiten [C1]). Schriften, Tokens, Grundregeln und
   die gemeinsamen Bausteine (Karte, Zeile, Abschnittstitel, Knopf, Knopf
   leise, Tag, Hinweis, Aktionen, Fuß) sind wörtlich aus
   assets/app/Startseite_v3.tpl (Abschnitte 1–4 und 8) übernommen –
   inhaltlich identisch, nur hierher ausgelagert, damit tools/app-optik/
   tpl-bauen.mjs sie den fünf neuen Vorlagen voranstellen kann.
   Startseite_v3.tpl selbst bleibt unverändert (produktiv, siehe C1-Spezifikation)
   und wird NICHT auf dieses Bauskript umgestellt – dieser Block hier ist eine
   bewusste Kopie, keine gemeinsame Quelle mit Startseite_v3.tpl.
   Kopf- und Tab-Leiste kommen von der App-Hülle und sind NICHT Teil dieser
   Vorlagen (kein eigener Kopf, kein eigener Fuß). Farben/Schrift/Abstände
   ausschließlich aus assets/css/tokens.css. Kein Foto, keine Kacheln, keine
   Sponsorenleiste, kein Eintracht-Design. */

/* === 1. Schriften (absolute GitHub-Pages-Adressen, siehe assets/app/styles.css) === */

@font-face {
  font-family: 'Barlow Condensed';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("https://justolgay.github.io/speuzer-website-prototyp/assets/fonts/barlow-condensed-600.woff2") format('woff2');
}

@font-face {
  font-family: 'Barlow Condensed';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("https://justolgay.github.io/speuzer-website-prototyp/assets/fonts/barlow-condensed-700.woff2") format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("https://justolgay.github.io/speuzer-website-prototyp/assets/fonts/inter.woff2") format('woff2');
}

/* === 2. Tokens (Teilmenge aus assets/css/tokens.css) === */

:root {
  --blau-950: #0B0E4A;
  --blau-900: #151A7A;
  --blau-800: #191793;
  --blau-700: #1F2DBE;
  --blau-500: #3D4FEA;
  --blau-100: #E4E7FA;
  --blau-50: #F3F5FC;
  --ink: #12142B;
  --ink-2: #3F4360;
  --ink-3: #5B6079;
  --line: #D8DBEA;
  --bg: #F5F6FB;
  --surface: #FFFFFF;
  --weiss: #FFFFFF;

  --font-head: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-text: "Inter", system-ui, sans-serif;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 20px;
  --r-pill: 999px;

  --sh-1: 0 1px 2px rgba(11, 14, 74, .06), 0 1px 1px rgba(11, 14, 74, .04);
  --sh-2: 0 8px 24px rgba(11, 14, 74, .10);
}

/* === 3. Grundregeln === */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
svg { display: block; flex: 0 0 auto; }

/* [hidden] muss auch gegen eigene display:flex/inline-flex-Regeln gewinnen –
   ohne diese Regel gewinnt die spezifischere Klassenregel gegen das
   UA-Stylesheet (siehe Startseite_v3.tpl, Schritt 1.1). */
[hidden] { display: none !important; }

.inhalt {
  padding: var(--sp-4);
  /* Die schwebende Tab-Leiste der App liegt über dem Seitenende (gemessen 21.09.2026) */
  padding-bottom: 96px;
}

/* === 4. Bausteine === */

.karte {
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  padding: var(--sp-4);
}

.zeile {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 56px;
  padding-block: var(--sp-2);
  text-decoration: none;
  color: inherit;
  border-bottom: 1px solid var(--line);
}

.zeile:last-child { border-bottom: none; }

.zeile__text { flex: 1 1 auto; min-width: 0; }

.zeile__titel {
  margin: 0;
  font-weight: 600;
  font-size: 15px;
  overflow-wrap: break-word;
}

.zeile__pfeil {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  color: var(--ink-3);
}

.abschnittstitel {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 20px;
  text-transform: uppercase;
  color: var(--blau-950);
  margin: var(--sp-6) 0 var(--sp-3);
  /* W9, Auftrag D (Entscheidung 13, App-weit): Überschriften nie
     automatisch trennen. */
  hyphens: manual;
  text-wrap: balance;
}

/* W9, Auftrag D (Entscheidung 13, App-weit): Fließtext mit ausgewogenerem
   Umbruch (unterstützende Browser; ohne Unterstützung normaler Umbruch). */
p { text-wrap: pretty; }

.inhalt > .abschnittstitel:first-child { margin-top: 0; }

/* Seitenkopf-Baustein (W8, App-weit): einheitlicher, kartenloser
   Einleitungssatz direkt unter dem (unsichtbaren) h1 jeder Seite – die
   App-Kopfleiste zeigt den Seitentitel bereits, ein eigener Kartentitel
   wäre doppelt. Gleicher Abstand nach unten wie ein Abschnittstitel. */
.seitenkopf-lead {
  margin: 0 0 var(--sp-5);
  font-size: 15px;
  color: var(--ink-2);
}

/* Aufklapper (W8, App-weit): kein natives Dreieck "▶" vor <summary> – der
   Chevron/"›" steht stattdessen im Text der jeweiligen Beschriftung. */
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::marker { content: ""; }

/* W10, Auftrag D (Entscheidung G): Innenabstand oben/unten gilt auch, wenn
   eine lange Beschriftung umbricht (vorher nur min-height + flex-center –
   ein zweizeiliger Knopf hatte dadurch keinerlei Abstand zur Kante),
   text-align:center zusätzlich zu justify-content, weil das bei mehrzeiligem
   Text pro Zeile zählt (justify-content zentriert nur den Textblock als
   Ganzes). Wörtlich wie Startseite_v3.tpl (siehe Kopfkommentar dieser
   Datei). */
.knopf {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 12px 20px;
  line-height: 1.3;
  text-align: center;
  border-radius: var(--r-md);
  background: var(--blau-700);
  color: var(--weiss);
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  border: none;
  cursor: pointer;
}

/* W9-Nachprüfung D-app Nr. 5: ein <button class="knopf"> erbt ohne
   font-family: inherit nicht die App-Schrift (User-Agent-Standard, z. B.
   Arial), anders als ein <a class="knopf"> – "font: inherit" setzt Familie/
   Größe/Gewicht zurück, deshalb Gewicht/Größe direkt danach wie .knopf
   erneut gesetzt. */
button.knopf {
  font: inherit;
  font-weight: 600;
  font-size: 14px;
}

/* W10-Nachprüfung (offen 10, Entscheidung 15): 2px Rand in Vereinsblau wie
   .knopf--sekundaer in base.css (Website) – der bisherige 1px hellgraue Rand
   war als Knopfkante kaum zu erkennen ("Nebenaktionen umrandet – auf
   Website und App gleich"). */
.knopf--leise {
  background: var(--surface);
  border: 2px solid var(--blau-700);
  color: var(--blau-800);
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  background: var(--blau-100);
  color: var(--blau-800);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .02em;
}

.hinweis {
  display: block;
  border-left: 3px solid var(--blau-700);
  background: var(--blau-50);
  padding: var(--sp-3) var(--sp-4);
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 14px;
  color: var(--ink-2);
  margin-top: var(--sp-5);
}

.hinweis p { margin: 0; }

/* === 8. Aktionen und Fuß === */

.aktionen {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
}

.fuss {
  margin: var(--sp-6) 0 0;
  font-size: 12px;
  color: var(--ink-3);
  text-align: center;
}

/* Spielplan-App.html – statische Workspace-Seite (C2, Abschnitt 2). Wird von
   tools/app-optik/tpl-bauen.mjs (Ausgabeart "statisch") NICHT mit
   dem appack-FreeMarker-Titelausdruck versehen (fester <title>), sondern 1:1 nach
   assets/app/Spielplan-App.html geschrieben und dort unter
   workspace/Spielplan-App.html ausgeliefert (Domain-Freigabe der
   FUSSBALL.DE-Widgets gilt nur für cdn.appack.de, siehe LIESMICH.md). */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.filterleiste {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}

.filter-knopf {
  min-height: 44px;
  min-width: 44px;
  justify-content: center;
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.filter-knopf--aktiv {
  background: var(--blau-700);
  color: var(--weiss);
}

.karte + .abschnittstitel { margin-top: var(--sp-6); }

.fussballde_widget {
  min-height: 240px;
  background: var(--blau-50);
  border-radius: var(--r-md);
}

.tabelle-wrapper {
  position: relative;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tabelle-wrapper.ist-wischbar::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 24px;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), var(--surface));
  pointer-events: none;
}

.tabelle-wischen-hinweis {
  display: none;
  margin: var(--sp-2) 0 0;
  font-size: 12px;
  color: var(--ink-3);
}

.tabelle-wischen-hinweis.ist-sichtbar {
  display: block;
}

.kinderfestival-iframe {
  width: 100%;
  height: 640px;
  border: 0;
  border-radius: var(--r-md);
  display: block;
}
</style>
</head>
<body>
<main class="inhalt">

<h1 class="visually-hidden">Spielplan &amp; Tabellen</h1>

<div id="team-pillen" class="filterleiste"></div>

<div id="team-inhalt"></div>

<h2 class="abschnittstitel">Kalender abonnieren</h2>
<div id="kalender-zeile" class="liste"></div>

<p class="fuss">F.F.V. Sportfreunde 04 · Vereins-App</p>

</main>

<script>
(function () {
  "use strict";

  // Widget-IDs des Vereins (data/widgets.json) – von tpl-bauen.mjs zur
  // Bauzeit eingesetzt (kein appack-FreeMarker-Ausdruck in dieser statischen Datei).
  var WIDGETS = {"herren":{"tabelle":"3cd98588-f2bd-4716-a6f8-c663afcd9a52","reiter":"Herren","spiele":"0bc2cd05-999e-4098-8f5a-01faac49eb40"},"a-jugend":{"tabelle":"19b1dbfb-9aad-44d2-90bb-71b244f8ce70","reiter":"A-Jugend","spiele":"7f1d494c-ad2d-47d0-bb61-f4f0106ac2c4"},"d1":{"tabelle":"1e9caaff-1559-444a-ad35-bb60f75e5dca","reiter":"D1","spiele":"97c0160c-4b7a-40e1-ac86-3c8a4b3c6f76"},"d2":{"tabelle":"a0e8a901-ccc9-4810-9fe4-c16f8dc6ca86","reiter":"D2","spiele":"1e1dcbe7-34a6-4727-9744-68096138a415"},"d3":{"tabelle":"f861a1b4-7b87-4b44-ae96-b217b8ba1758","reiter":"D3","spiele":"81d9f5d7-9465-4aa5-ba6e-9830577ec0e6"},"e1":{"tabelle":"210e4f4f-cd22-4771-ae3b-423b6061afe1","reiter":"E1","spiele":"946f72f6-9ef2-4199-8b9d-6051948a2103"},"e2":{"tabelle":"47a2d17f-97d4-45ab-87cd-cb6faf6e0d93","reiter":"E2","spiele":"52cf66bf-3feb-436d-80fa-831c186dbb64"},"e3":{"tabelle":"8a18ef30-e4ac-4936-8049-18dfd14d08f4","reiter":"E3","spiele":"15839ff7-ac56-422d-9853-b240229822ec"},"verein":{"spiele":"49e9745b-dc1c-4ae2-9292-b06c0f7a6c6e"},"f1":{"reiter":"F1"},"f2":{"reiter":"F2"},"g-jugend":{"reiter":"G1"}};

  var SPEICHER_SCHLUESSEL = "speuzer.spielplan.team";
  var GENERATOR_BASIS = "https://justolgay.github.io/speuzer-spielplan/";
  var KALENDER_BASIS = "https://justolgay.github.io/speuzer-spielplan/";

  // Reihenfolge und Beschriftung wie in der C2-Spezifikation (Abschnitt 2).
  var TEAMS = [
    { schluessel: "herren", label: "Herren", kalenderDatei: "herren" },
    { schluessel: "a-jugend", label: "A-Jugend", kalenderDatei: "a" },
    { schluessel: "d1", label: "D1", kalenderDatei: "d1" },
    { schluessel: "d2", label: "D2", kalenderDatei: "d2" },
    { schluessel: "d3", label: "D3", kalenderDatei: "d3" },
    { schluessel: "e1", label: "E1", kalenderDatei: "e1" },
    { schluessel: "e2", label: "E2", kalenderDatei: "e2" },
    { schluessel: "e3", label: "E3", kalenderDatei: "e3" },
    { schluessel: "f1", label: "F1", kalenderDatei: "f1", generatorGruppe: "f-jugend" },
    { schluessel: "f2", label: "F2", kalenderDatei: "f2", generatorGruppe: "f-jugend" },
    { schluessel: "g-jugend", label: "G1", kalenderDatei: "g1", generatorGruppe: "g-jugend" },
  ];

  function teamZuSchluessel(wert) {
    var w = String(wert || "").trim().toLowerCase();
    if (!w) return null;
    for (var i = 0; i < TEAMS.length; i++) {
      if (TEAMS[i].schluessel === w || TEAMS[i].label.toLowerCase() === w) return TEAMS[i].schluessel;
    }
    return null;
  }

  function ermittleAusgewaehltesTeam() {
    var ausHash = teamZuSchluessel(window.location.hash.replace(/^#/, ""));
    if (ausHash) return ausHash;
    var gespeichert = null;
    try {
      gespeichert = window.localStorage.getItem(SPEICHER_SCHLUESSEL);
    } catch (e) {
      gespeichert = null;
    }
    var ausSpeicher = teamZuSchluessel(gespeichert);
    if (ausSpeicher) return ausSpeicher;
    return "herren";
  }

  function teamByKey(schluessel) {
    for (var i = 0; i < TEAMS.length; i++) {
      if (TEAMS[i].schluessel === schluessel) return TEAMS[i];
    }
    return TEAMS[0];
  }

  // ---------- Widget-/Iframe-Bausteine ----------

  function baueWidget(widgetId, widgetType) {
    var container = document.createElement("div");
    container.className = "fussballde_widget";
    container.setAttribute("data-id", widgetId);
    container.setAttribute("data-type", widgetType);
    return container;
  }

  // Das echte FUSSBALL.DE-Widget setzt ein <iframe width="100%"> ein, das
  // nie horizontal scrollt – der Wischen-Hinweis und der Schatten sollen
  // deshalb nur erscheinen, wenn die Tabelle nach dem Widget-Resize
  // tatsaechlich breiter ist als ihr sichtbarer Bereich (QA-Befund, C2b).
  function aktualisiereWischHinweis(wrapper, hinweis) {
    var brauchtWischen = window.innerWidth < 640 && wrapper.scrollWidth > wrapper.clientWidth;
    wrapper.classList.toggle("ist-wischbar", brauchtWischen);
    hinweis.classList.toggle("ist-sichtbar", brauchtWischen);
  }

  function baueTabelleKarte(widgetId) {
    var karte = document.createElement("div");
    karte.className = "karte";
    var wrapper = document.createElement("div");
    wrapper.className = "tabelle-wrapper";
    wrapper.appendChild(baueWidget(widgetId, "table"));
    karte.appendChild(wrapper);
    var hinweis = document.createElement("p");
    hinweis.className = "tabelle-wischen-hinweis";
    hinweis.textContent = "Tabelle seitlich wischbar";
    karte.appendChild(hinweis);
    window.addEventListener("message", function (event) {
      var typ = event.data && typeof event.data === "object" ? event.data.type : event.data;
      if (typ !== "fussballde_widget:resize") return;
      aktualisiereWischHinweis(wrapper, hinweis);
    });
    return karte;
  }

  function baueKinderfestivalIframe(team) {
    var iframe = document.createElement("iframe");
    iframe.className = "kinderfestival-iframe";
    iframe.loading = "lazy";
    iframe.title = "Spielplan " + team.label + " (Kinderfestival)";
    iframe.src = GENERATOR_BASIS + "app-" + team.generatorGruppe + ".html#" + encodeURIComponent(team.label);
    window.addEventListener("message", function (event) {
      if (event.origin !== "https://justolgay.github.io") return;
      if (event.source !== iframe.contentWindow) return;
      var h = event.data && event.data.speuzerHeight;
      if (typeof h !== "number" || h < 200 || h > 20000) return;
      iframe.style.height = h + "px";
    });
    return iframe;
  }

  function baueHinweisKarte(text) {
    var karte = document.createElement("div");
    karte.className = "karte hinweis";
    var p = document.createElement("p");
    p.textContent = text;
    karte.appendChild(p);
    return karte;
  }

  function baueAbschnitt(titel, inhaltNode) {
    var wrapper = document.createDocumentFragment();
    var h2 = document.createElement("h2");
    h2.className = "abschnittstitel";
    h2.textContent = titel;
    wrapper.appendChild(h2);
    wrapper.appendChild(inhaltNode);
    return wrapper;
  }

  // ---------- Inhalt eines Teams ----------

  function renderTeam(schluessel) {
    var team = teamByKey(schluessel);
    var eintrag = WIDGETS[team.schluessel] || {};
    var inhalt = document.getElementById("team-inhalt");
    inhalt.innerHTML = "";

    if (eintrag.spiele) {
      var naechstesKarte = document.createElement("div");
      naechstesKarte.className = "karte";
      naechstesKarte.appendChild(baueWidget(eintrag.spiele, "next-match"));
      inhalt.appendChild(baueAbschnitt("Nächstes Spiel", naechstesKarte));

      var saisonKarte = document.createElement("div");
      saisonKarte.className = "karte";
      saisonKarte.appendChild(baueWidget(eintrag.spiele, "team-matches"));
      inhalt.appendChild(baueAbschnitt("Spielplan der Saison", saisonKarte));
    } else if (team.generatorGruppe) {
      var iframeKarte = document.createElement("div");
      iframeKarte.className = "karte";
      iframeKarte.appendChild(baueKinderfestivalIframe(team));
      inhalt.appendChild(baueAbschnitt("Spielplan der Saison", iframeKarte));
    }

    if (eintrag.tabelle) {
      inhalt.appendChild(baueAbschnitt("Tabelle", baueTabelleKarte(eintrag.tabelle)));
    } else if (team.generatorGruppe) {
      inhalt.appendChild(baueAbschnitt("Tabelle", baueHinweisKarte("Im Kinderfußball gibt es keine Tabellen.")));
    }

    // Kalender abonnieren
    var kalenderZeile = document.getElementById("kalender-zeile");
    kalenderZeile.innerHTML = "";
    kalenderZeile.appendChild(baueKalenderLink("Spielplan " + team.label + " (ICS)", KALENDER_BASIS + team.kalenderDatei + ".ics"));
    kalenderZeile.appendChild(baueKalenderLink("Trainingszeiten " + team.label + " (ICS)", KALENDER_BASIS + "training-" + team.kalenderDatei + ".ics"));
  }

  function baueKalenderLink(text, href) {
    var link = document.createElement("a");
    link.className = "zeile";
    link.href = href;
    var textSpan = document.createElement("span");
    textSpan.className = "zeile__text";
    var titelSpan = document.createElement("span");
    titelSpan.className = "zeile__titel";
    titelSpan.textContent = text;
    textSpan.appendChild(titelSpan);
    link.appendChild(textSpan);
    return link;
  }

  // ---------- Team-Pillen ----------

  function baueTeamPillen(ausgewaehlt) {
    var pillenZeile = document.getElementById("team-pillen");
    pillenZeile.innerHTML = "";
    for (var i = 0; i < TEAMS.length; i++) {
      var team = TEAMS[i];
      var knopf = document.createElement("button");
      knopf.type = "button";
      knopf.className = "tag filter-knopf" + (team.schluessel === ausgewaehlt ? " filter-knopf--aktiv" : "");
      knopf.textContent = team.label;
      knopf.setAttribute("data-team", team.schluessel);
      knopf.addEventListener("click", function () {
        var neuesTeam = this.getAttribute("data-team");
        try {
          window.localStorage.setItem(SPEICHER_SCHLUESSEL, neuesTeam);
        } catch (e) {
          // localStorage kann in privaten Fenstern fehlschlagen – Hash reicht als Zustand.
        }
        // widgets.js (FUSSBALL.DE) bietet keine Init-Funktion für neu
        // eingefügte Container (geprüft im Quelltext) – ein voller Neuladen
        // mit dem neuen Hash ist die zuverlässige Lösung (Hash hält den
        // Zustand über den Reload hinweg).
        window.location.hash = teamByKey(neuesTeam).label;
        window.location.reload();
      });
      pillenZeile.appendChild(knopf);
    }
  }

  // ---------- Ablauf ----------

  var ausgewaehlt = ermittleAusgewaehltesTeam();
  try {
    window.localStorage.setItem(SPEICHER_SCHLUESSEL, ausgewaehlt);
  } catch (e) {
    // ohne localStorage bleibt der Hash die einzige Zustandsquelle
  }
  baueTeamPillen(ausgewaehlt);
  renderTeam(ausgewaehlt);

  // FUSSBALL.DE-Widgets: Skript einmal laden, nachdem die Widget-Container
  // im DOM stehen (die Bibliothek scannt beim eigenen DOMContentLoaded bzw.
  // sofort, wenn das Dokument schon geladen ist).
  var widgetSkript = document.createElement("script");
  widgetSkript.src = "https://www.fussball.de/widgets.js";
  document.body.appendChild(widgetSkript);
})();
</script>
